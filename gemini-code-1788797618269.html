<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashMath ⚡ - Repaso Matemático Instantáneo</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/js-confetti@latest/dist/js-confetti.browser.js"></script>
    <style>
        :root {
            --bg-main: #0F172A;
            --bg-card: #1E293B;
            --bg-card-hover: #334155;
            --primary: #4F46E5;
            --primary-shadow: #3730A3;
            --success: #10B981;
            --success-shadow: #059669;
            --error: #F43F5E;
            --error-shadow: #E11D48;
            --cyan: #38BDF8;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Modificación 3: Contenedor adaptado para pantallas grandes */
        .app-container {
            width: 100%;
            max-width: 900px; /* Aumentado para diagramas más grandes */
            background-color: rgba(30, 41, 59, 0.7);
            border: 1px solid #334155;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        /* --- Header global --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 2px solid #334155;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .logo span { color: var(--cyan); }

        .stats-badge {
            display: flex;
            gap: 12px;
        }

        .badge {
            background: var(--bg-card);
            border: 1px solid #334155;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge.fire { color: #F59E0B; }
        .badge.xp { color: var(--cyan); }

        /* --- Estilo de Pantallas --- */
        .screen {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- PANTALLA 1: Buscador --- */
        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            background: var(--bg-card);
            border: 2px solid #334155;
            border-radius: var(--radius);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
            color: var(--text-muted);
        }

        .chips-container {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .chip {
            background: var(--bg-card);
            border: 1px solid #334155;
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .chip.active, .chip:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .topics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 16px;
        }

        .topic-card {
            background: var(--bg-card);
            border: 2px solid #334155;
            border-radius: var(--radius);
            padding: 18px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .topic-card:hover {
            transform: translateY(-3px);
            border-color: var(--cyan);
            background: var(--bg-card-hover);
        }

        .topic-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .topic-icon { font-size: 2rem; }
        .topic-title { font-weight: 700; font-size: 1.05rem; }
        
        /* Modificación 4: Explicación previa en cada tema */
        .topic-desc { 
            font-size: 0.82rem; 
            color: var(--text-muted); 
            line-height: 1.35; 
            border-top: 1px solid #334155;
            padding-top: 8px;
        }

        /* --- PANTALLA 2: Juego / Tarjetas --- */
        .quiz-progress {
            height: 10px;
            background: #334155;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .quiz-progress-bar {
            height: 100%;
            width: 0%;
            background: var(--cyan);
            transition: width 0.3s ease;
        }

        .card {
            background: var(--bg-card);
            border: 2px solid #334155;
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .card-question {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        /* Modificación 3: Diagrama agrandado ocupando más espacio */
        .card-svg-container {
            background: var(--bg-main);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            min-height: 280px; /* Mayor altura */
            max-height: 420px;
            width: 100%;
        }

        .card-svg-container svg {
            width: 100%;
            height: 100%;
            max-height: 320px;
        }

        /* Modificación 2: Botón de pista y caja de fórmulas */
        .hint-btn {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid #F59E0B;
            color: #F59E0B;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            margin-bottom: 15px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .hint-btn:hover {
            background: #F59E0B;
            color: var(--bg-main);
        }

        .hint-box {
            background: rgba(245, 158, 11, 0.1);
            border: 1px dashed #F59E0B;
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: #FCD34D;
            display: none;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-option {
            background: var(--bg-card);
            color: var(--text-main);
            border: 2px solid #334155;
            border-bottom: 5px solid #334155;
            padding: 16px;
            border-radius: var(--radius);
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.1s;
            outline: none;
        }

        .btn-option:active {
            transform: translateY(3px);
            border-bottom-width: 2px;
        }

        .btn-option.correct {
            background: var(--success) !important;
            border-color: var(--success-shadow) !important;
            color: white;
        }

        .btn-option.incorrect {
            background: var(--error) !important;
            border-color: var(--error-shadow) !important;
            color: white;
            animation: shake 0.3s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .explanation-box {
            margin-top: 15px;
            padding: 12px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--cyan);
            border-radius: 12px;
            font-size: 0.9rem;
            color: var(--cyan);
            display: none;
            text-align: left;
        }

        /* --- PANTALLA 3: Resumen --- */
        .results-box {
            text-align: center;
            padding: 20px 0;
        }

        .results-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--cyan);
        }

        .results-scorecard {
            background: var(--bg-card);
            border: 2px solid #334155;
            border-radius: var(--radius);
            padding: 20px;
            margin: 20px 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .score-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .score-value {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .score-label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .btn-action {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-bottom: 5px solid var(--primary-shadow);
            padding: 16px;
            border-radius: var(--radius);
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.1s;
        }

        .btn-action:active {
            transform: translateY(3px);
            border-bottom-width: 2px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="header">
            <div class="logo" onclick="showScreen(1)">
                <span>FLASH</span>MATH⚡
            </div>
            <div class="stats-badge">
                <div class="badge fire">🔥 <span id="streak-count">0</span></div>
                <div class="badge xp">⭐ <span id="xp-count">0</span></div>
            </div>
        </header>

        <!-- PANTALLA 1: Buscador y Selección de Temas -->
        <section id="screen-1" class="screen active">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" class="search-input" placeholder="¿Qué concepto o fórmula buscas hoy?" oninput="filterTopics()">
            </div>

            <div class="chips-container">
                <button class="chip active" onclick="filterCategory('all', this)">Todos (5)</button>
                <button class="chip" onclick="filterCategory('Geometría', this)">Geometría</button>
                <button class="chip" onclick="filterCategory('Álgebra', this)">Álgebra</button>
                <button class="chip" onclick="filterCategory('Trigonometría', this)">Trigonometría</button>
            </div>

            <div class="topics-grid" id="topics-grid">
                <!-- Temas inyectados mediante JS -->
            </div>
        </section>

        <!-- PANTALLA 2: Juego interactivo -->
        <section id="screen-2" class="screen">
            <div class="quiz-progress">
                <div class="quiz-progress-bar" id="progress-bar"></div>
            </div>

            <div class="card">
                <div class="card-question" id="card-question">Pregunta...</div>
                
                <!-- Diagrama ampliado SVG -->
                <div class="card-svg-container" id="card-svg"></div>

                <!-- Modificación 2: Opción para obtener pistas antes de responder -->
                <div>
                    <button class="hint-btn" onclick="toggleHint()">💡 Ver Fórmula / Pista</button>
                    <div class="hint-box" id="hint-box"></div>
                </div>

                <div class="explanation-box" id="explanation-box"></div>
            </div>

            <div class="options-grid" id="options-grid"></div>
        </section>

        <!-- PANTALLA 3: Resumen -->
        <section id="screen-3" class="screen">
            <div class="results-box">
                <div style="font-size: 3.5rem; margin-bottom: 10px;">🏆</div>
                <div class="results-title">¡Sesión Completada!</div>
                <p style="color: var(--text-muted);">¡Excelente trabajo repasando tus conceptos!</p>

                <div class="results-scorecard">
                    <div class="score-item">
                        <span class="score-value" id="res-score">0/0</span>
                        <span class="score-label">Aciertos</span>
                    </div>
                    <div class="score-item">
                        <span class="score-value" id="res-xp">+0</span>
                        <span class="score-label">Puntos XP</span>
                    </div>
                </div>

                <button class="btn-action" onclick="showScreen(1)">Buscar Otro Tema</button>
            </div>
        </section>
    </div>

    <script>
        // --- BASE DE DATOS ACTUALIZADA CON 5 TEMAS Y MÍNIMO 5 PREGUNTAS CADA UNO ---
        const database = [
            {
                id: "pitagoras",
                title: "Teorema de Pitágoras",
                category: "Geometría",
                icon: "📐",
                formula: "c² = a² + b² (donde c es la hipotenusa y a, b son los catetos)",
                desc: "Relación en triángulos rectángulos donde la suma de catetos al cuadrado es igual a la hipotenusa al cuadrado.",
                questions: [
                    {
                        q: "En un triángulo rectángulo con catetos a = 3 y b = 4, ¿cuánto vale la hipotenusa (c)?",
                        svg: `<svg viewBox="0 0 300 200">
                                <polygon points="40,160 260,160 40,30" fill="rgba(56,189,248,0.1)" stroke="#38BDF8" stroke-width="4"/>
                                <text x="140" y="185" fill="#F8FAFC" font-size="16">b = 4</text>
                                <text x="15" y="100" fill="#F8FAFC" font-size="16">a = 3</text>
                                <text x="160" y="85" fill="#38BDF8" font-size="18" font-weight="bold">c = ?</text>
                              </svg>`,
                        options: ["5", "6", "7", "2.5"],
                        correct: 0,
                        exp: "💡 c² = 3² + 4² ➔ c² = 9 + 16 = 25 ➔ c = √25 = 5"
                    },
                    {
                        q: "Si la hipotenusa c = 10 y un cateto a = 6, ¿cuánto mide el cateto b?",
                        svg: `<svg viewBox="0 0 300 200">
                                <polygon points="40,160 240,160 40,30" fill="rgba(56,189,248,0.1)" stroke="#38BDF8" stroke-width="4"/>
                                <text x="130" y="185" fill="#38BDF8" font-size="18" font-weight="bold">b = ?</text>
                                <text x="15" y="100" fill="#F8FAFC" font-size="16">a = 6</text>
                                <text x="150" y="85" fill="#F8FAFC" font-size="16">c = 10</text>
                              </svg>`,
                        options: ["8", "7", "9", "6.5"],
                        correct: 0,
                        exp: "💡 b² = c² - a² ➔ b² = 10² - 6² = 100 - 36 = 64 ➔ b = √64 = 8"
                    },
                    {
                        q: "¿Cuál es la expresión matemática correcta del Teorema de Pitágoras?",
                        svg: `<svg viewBox="0 0 300 180">
                                <polygon points="50,140 230,140 50,30" fill="rgba(79,70,229,0.2)" stroke="#4F46E5" stroke-width="4"/>
                              </svg>`,
                        options: ["a + b = c", "c² = a² + b²", "a² - b² = c²", "2a + 2b = c"],
                        correct: 1,
                        exp: "💡 El cuadrado de la hipotenusa (c²) equivale a la suma de los cuadrados de los catetos (a² + b²)."
                    },
                    {
                        q: "En un triángulo con catetos a = 5 y b = 12, calcula c.",
                        svg: `<svg viewBox="0 0 300 200">
                                <polygon points="30,170 270,170 30,30" fill="rgba(56,189,248,0.1)" stroke="#38BDF8" stroke-width="4"/>
                                <text x="130" y="190" fill="#F8FAFC" font-size="16">b = 12</text>
                                <text x="10" y="100" fill="#F8FAFC" font-size="16">a = 5</text>
                                <text x="150" y="90" fill="#38BDF8" font-size="18" font-weight="bold">c = ?</text>
                              </svg>`,
                        options: ["13", "14", "15", "11"],
                        correct: 0,
                        exp: "💡 c² = 5² + 12² = 25 + 144 = 169 ➔ c = √169 = 13"
                    },
                    {
                        q: "¿A qué tipo de triángulos se aplica directamente este teorema?",
                        svg: `<svg viewBox="0 0 300 180">
                                <rect x="40" y="120" width="20" height="20" fill="none" stroke="#F43F5E" stroke-width="2"/>
                                <polygon points="40,140 240,140 40,20" fill="none" stroke="#38BDF8" stroke-width="4"/>
                              </svg>`,
                        options: ["Equiláteros", "Obtusángulos", "Rectángulos (ángulo de 90°)", "Isósceles"],
                        correct: 2,
                        exp: "💡 Solo aplica a triángulos rectángulos que poseen un ángulo recto de 90°."
                    }
                ]
            },
            {
                id: "area-circulo",
                title: "Área del Círculo",
                category: "Geometría",
                icon: "⭕",
                formula: "A = π · r² (donde r es el radio del círculo)",
                desc: "Cálculo de la superficie delimitada por la circunferencia a partir de su radio r.",
                questions: [
                    {
                        q: "¿Cuál es el área de un círculo con radio r = 3 cm?",
                        svg: `<svg viewBox="0 0 300 200">
                                <circle cx="150" cy="100" r="75" fill="rgba(56,189,248,0.1)" stroke="#38BDF8" stroke-width="4"/>
                                <line x1="150" y1="100" x2="225" y2="100" stroke="#F43F5E" stroke-width="3"/>
                                <text x="175" y="90" fill="#F43F5E" font-size="16" font-weight="bold">r = 3 cm</text>
                              </svg>`,
                        options: ["6π cm²", "9π cm²", "12π cm²", "3π cm²"],
                        correct: 1,
                        exp: "💡 Área = π × r² ➔ Área = π × 3² = 9π cm²"
                    },
                    {
                        q: "Si el diámetro de un círculo mide 10 cm, ¿cuál es su área?",
                        svg: `<svg viewBox="0 0 300 200">
                                <circle cx="150" cy="100" r="75" fill="rgba(56,189,248,0.1)" stroke="#38BDF8" stroke-width="4"/>
                                <line x1="75" y1="100" x2="225" y2="100" stroke="#F59E0B" stroke-width="3" stroke-dasharray="6,6"/>
                                <text x="120" y="90" fill="#F59E0B" font-size="16" font-weight="bold">d = 10 cm</text>
                              </svg>`,
                        options: ["25π cm²", "100π cm²", "10π cm²", "50π cm²"],
                        correct: 0,
                        exp: "💡 El radio r = d/2 = 5 cm. Área = π × 5² = 25π cm²"
                    },
                    {
                        q: "Si r = 1 cm, ¿cuánto vale su área exacta?",
                        svg: `<svg viewBox="0 0 300 200">
                                <circle cx="150" cy="100" r="60" fill="rgba(56,189,248,0.1)" stroke="#38BDF8" stroke-width="4"/>
                                <line x1="150" y1="100" x2="210" y2="100" stroke="#F43F5E" stroke-width="3"/>
                                <text x="165" y="90" fill="#F43F5E" font-size="16">r = 1</text>
                              </svg>`,
                        options: ["1 cm²", "π cm²", "2π cm²", "0.5π cm²"],
                        correct: 1,
                        exp: "💡 A = π × (1)² = π cm²"
                    },
                    {
                        q: "Determina el área si r = 4 m.",
                        svg: `<svg viewBox="0 0 300 200">
                                <circle cx="150" cy="100" r="80" fill="rgba(56,189,248,0.1)" stroke="#38BDF8" stroke-width="4"/>
                                <line x1="150" y1="100" x2="230" y2="100" stroke="#F43F5E" stroke-width="3"/>
                                <text x="175" y="90" fill="#F43F5E" font-size="16">r = 4 m</text>
                              </svg>`,
                        options: ["8π m²", "12π m²", "16π m²", "20π m²"],
                        correct: 2,
                        exp: "💡 A = π × 4² = 16π m²"
                    },
                    {
                        q: "¿Qué representa la 'r' en la fórmula del área del círculo?",
                        svg: `<svg viewBox="0 0 300 180">
                                <circle cx="150" cy="90" r="65" fill="none" stroke="#38BDF8" stroke-width="3"/>
                                <line x1="150" y1="90" x2="215" y2="90" stroke="#10B981" stroke-width="4"/>
                              </svg>`,
                        options: ["Radio", "Perímetro", "Diámetro", "Ángulo"],
                        correct: 0,
                        exp: "💡 r corresponde al radio, la distancia del centro a cualquier punto del borde."
                    }
                ]
            },
            {
                id: "area-figuras",
                title: "Áreas: Cuadrado y Triángulo",
                category: "Geometría",
                icon: "🔷",
                formula: "Cuadrado: Area = s² | Triángulo: Area = (base × altura) / 2",
                desc: "Cálculo de superficies fundamentales para cuadriláteros regulares y triángulos.",
                questions: [
                    {
                        q: "¿Cuál es el área de un cuadrado con lado s = 5 cm?",
                        svg: `<svg viewBox="0 0 300 200">
                                <rect x="90" y="40" width="120" height="120" fill="rgba(56,189,248,0.1)" stroke="#38BDF8" stroke-width="4"/>
                                <text x="135" y="180" fill="#F8FAFC" font-size="16">s = 5 cm</text>
                              </svg>`,
                        options: ["20 cm²", "25 cm²", "10 cm²", "15 cm²"],
                        correct: 1,
                        exp: "💡 Área Cuadrado = s² ➔ 5² = 25 cm²"
                    },
                    {
                        q: "Calcula el área de un triángulo con base = 8 cm y altura = 5 cm.",
                        svg: `<svg viewBox="0 0 300 200">
                                <polygon points="50,160 250,160 150,40" fill="rgba(56,189,248,0.1)" stroke="#38BDF8" stroke-width="4"/>
                                <line x1="150" y1="40" x2="150" y2="160" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,4"/>
                                <text x="125" y="180" fill="#F8FAFC" font-size="16">base = 8</text>
                                <text x="160" y="100" fill="#F59E0B" font-size="16">h = 5</text>
                              </svg>`,
                        options: ["40 cm²", "20 cm²", "13 cm²", "30 cm²"],
                        correct: 1,
                        exp: "💡 Área Triángulo = (base × altura) / 2 ➔ (8 × 5) / 2 = 40 / 2 = 20 cm²"
                    },
                    {
                        q: "Un cuadrado tiene un área de 36 m², ¿cuánto mide cada lado (s)?",
                        svg: `<svg viewBox="0 0 300 180">
                                <rect x="90" y="30" width="120" height="120" fill="rgba(79,70,229,0.2)" stroke="#4F46E5" stroke-width="4"/>

            {

                formula: "Diferencia de cuadrados: a² - b² = (a - b)(a + b) | Trinomio: x² + (a+b)x + ab = (x+a)(x+b)",
                desc: "Proceso de descomponer una expresión algebraica en factores más simples.",
                questions: [
                    {
                        q: "Factoriza la diferencia de cuadrados: x² - 9",
                        svg: `<svg viewBox="0 0 300 180">
                                <text x="70" y="100" fill="#38BDF8" font-size="28" font-weight="bold">x² - 9 = ?</text>
                              </svg>`,
                        options: ["(x - 3)(x + 3)", "(x - 9)(x + 1)", "(x - 3)²", "(x + 3)²"],
                        correct: 0,
                        exp: "💡 Diferencia de cuadrados: a² - b² = (a - b)(a + b) ➔ x² - 3² = (x - 3)(x + 3)"
                    },
                    {
                        q: "Factoriza sacando el factor común: 4x + 12",
                        svg: `<svg viewBox="0 0 300 180">
                                <text x="60" y="100" fill="#38BDF8" font-size="28" font-weight="bold">4x + 12 = ?</text>
                              </svg>`,
                        options: ["4(x + 3)", "2(2x + 4)", "x(4 + 12)", "4(x + 12)"],
                        correct: 0,
                        exp: "💡 Factor común es 4 ➔ 4(x + 3)"
                    },
                    {
                        q: "Factoriza el trinomio: x² + 5x + 6",
                        svg: `<svg viewBox="0 0 300 180">
                                <text x="40" y="100" fill="#38BDF8" font-size="26" font-weight="bold">x² + 5x + 6 = ?</text>
                              </svg>`,
                        options: ["(x + 2)(x + 3)", "(x + 1)(x + 6)", "(x - 2)(x - 3)", "(x + 5)(x + 1)"],
                        correct: 0,
                        exp: "💡 Buscamos dos números que sumados den 5 y multiplicados 6: (2 y 3) ➔ (x + 2)(x + 3)"
                    },
                    {
                        q: "Factoriza: x² - 16",
                        svg: `<svg viewBox="0 0 300 180">
                                <text x="70" y="100" fill="#38BDF8" font-size="28" font-weight="bold">x² - 16 = ?</text>
                              </svg>`,
                        options: ["(x - 4)(x + 4)", "(x - 8)(x + 2)", "(x - 4)²", "(x - 16)(x + 1)"],
                        correct: 0,
                        exp: "💡 x² - 4² = (x - 4)(x + 4)"
                    },
                    {
                        q: "Factor común de: 3x² + 6x",
                        svg: `<svg viewBox="0 0 300 180">
                                <text x="50" y="100" fill="#38BDF8" font-size="26" font-weight="bold">3x² + 6x = ?</text>
                              </svg>`,
                        options: ["3x(x + 2)", "3(x² + 2)", "x(3x + 6)", "6x(x + 1)"],
                        correct: 0,
                        exp: "💡 Factor común máximo: 3x ➔ 3x(x + 2)"
                    }
                ]
            },
            {
                id: "trigonometria",
                title: "Razones Trigonométricas",
                category: "Trigonometría",
                icon: "📊",
                formula: "SOH-CAH-TOA ➔ Sen = Op/Hip | Cos = Ady/Hip | Tan = Op/Ady",
                desc: "Relaciones matemáticas entre los ángulos agudos y los lados de un triángulo rectángulo.",
                questions: [
                    {
                        q: "¿A qué es igual el Seno (sen) de un ángulo?",
                        svg: `<svg viewBox="0 0 300 200">
                                <polygon points="50,160 250,160 250,40" fill="none" stroke="#38BDF8" stroke-width="4"/>
                                <text x="80" y="150" fill="#F8FAFC" font-size="18">θ</text>
                                <text x="260" y="100" fill="#F43F5E" font-size="14">Opuesto</text>
                                <text x="130" y="180" fill="#F8FAFC" font-size="14">Adyacente</text>
                                <text x="120" y="90" fill="#38BDF8" font-size="14">Hipotenusa</text>
                              </svg>`,
                        options: ["Cateto Opuesto / Hipotenusa", "Cateto Adyacente / Hipotenusa", "Cateto Opuesto / Adyacente", "Hipotenusa / Cateto Opuesto"],
                        correct: 0,
                        exp: "💡 Seno = Opuesto / Hipotenusa (SOH)"
                    },
                    {
                        q: "¿Cómo se define la Tangente (tan) de un ángulo θ?",
                        svg: `<svg viewBox="0 0 300 180">
                                <polygon points="50,150 230,150 230,30" fill="none" stroke="#38BDF8" stroke-width="4"/>
                                <text x="80" y="140" fill="#F8FAFC" font-size="18">θ</text>
                              </svg>`,
                        options: ["Cateto Opuesto / Cateto Adyacente", "Cateto Adyacente / Hipotenusa", "Hipotenusa / Cateto Opuesto", "Opuesto / Hipotenusa"],
                        correct: 0,
                        exp: "💡 Tangente = Cateto Opuesto / Cateto Adyacente (TOA)"
                    },
                    {
                        q: "Si el Cateto Adyacente = 4 y la Hipotenusa = 5, ¿cuánto vale Cos(θ)?",
                        svg: `<svg viewBox="0 0 300 180">
                                <polygon points="50,150 230,150 230,30" fill="none" stroke="#38BDF8" stroke-width="4"/>
                                <text x="120" y="170" fill="#F8FAFC" font-size="16">Ady = 4</text>
                                <text x="110" y="80" fill="#38BDF8" font-size="16">Hip = 5</text>
                              </svg>`,
                        options: ["4/5", "3/5", "5/4", "3/4"],
                        correct: 0,
                        exp: "💡 Coseno = Adyacente / Hipotenusa ➔ 4/5"
                    },
                    {
                        q: "¿Qué mnemotecnia es famosa para recordar las tres razones básicas?",
                        svg: `<svg viewBox="0 0 300 160">
                                <text x="40" y="90" fill="#F59E0B" font-size="28" font-weight="bold">SOH - CAH - TOA</text>
                              </svg>`,
                        options: ["SOH-CAH-TOA", "PITAGORAS", "FACTOR-X", "ALGEBRA"],
                        correct: 0,
                        exp: "💡 SOH (Sen=Op/Hip), CAH (Cos=Ady/Hip), TOA (Tan=Op/Ady)."
                    },
                    {
                        q: "¿A qué equivale Coseno (cos) de θ?",
                        svg: `<svg viewBox="0 0 300 160">
                                <polygon points="40,140 220,140 220,30" fill="rgba(56,189,248,0.1)" stroke="#38BDF8" stroke-width="4"/>
                              </svg>`,
                        options: ["Adyacente / Hipotenusa", "Opuesto / Hipotenusa", "Opuesto / Adyacente", "Hipotenusa / Adyacente"],
                        correct: 0,
                        exp: "💡 Coseno = Cateto Adyacente / Hipotenusa (CAH)"
                    }
                ]
            }
        ];

        // --- ESTADO GLOBAL Y PERSISTENCIA ---
        let userStats = {
            streak: parseInt(localStorage.getItem('fm_streak')) || 0,
            xp: parseInt(localStorage.getItem('fm_xp')) || 0
        };

        let currentQuiz = {
            topic: null,
            questions: [],
            index: 0,
            score: 0,
            gainedXP: 0
        };

        const jsConfetti = new JSConfetti();

        // --- INICIALIZACIÓN ---
        document.addEventListener('DOMContentLoaded', () => {
            updateStatsUI();
            renderTopics(database);
        });

        function showScreen(screenNum) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(`screen-${screenNum}`).classList.add('active');
        }

        function updateStatsUI() {
            document.getElementById('streak-count').innerText = userStats.streak;
            document.getElementById('xp-count').innerText = userStats.xp;
            localStorage.setItem('fm_streak', userStats.streak);
            localStorage.setItem('fm_xp', userStats.xp);
        }

        // --- PANTALLA 1: RENDERIZADO DE TEMAS ---
        function renderTopics(topics) {
            const grid = document.getElementById('topics-grid');
            grid.innerHTML = '';
            
            topics.forEach(t => {
                grid.innerHTML += `
                    <div class="topic-card" onclick="startQuiz('${t.id}')">
                        <div class="topic-header">
                            <div class="topic-icon">${t.icon}</div>
                            <div>
                                <div class="topic-title">${t.title}</div>
                                <span style="font-size: 0.75rem; color: var(--cyan); font-weight: 600;">${t.category} • ${t.questions.length} ejer.</span>
                            </div>
                        </div>
                        <div class="topic-desc">${t.desc}</div>
                    </div>
                `;
            });
        }

        function filterTopics() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = database.filter(t => 
                t.title.toLowerCase().includes(query) || 
                t.category.toLowerCase().includes(query) ||
                t.desc.toLowerCase().includes(query)
            );
            renderTopics(filtered);
        }

        function filterCategory(cat, btn) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');

            if (cat === 'all') {
                renderTopics(database);
            } else {
                renderTopics(database.filter(t => t.category === cat));
            }
        }

        // --- PANTALLA 2: JUEGO Y PISTAS ---
        function startQuiz(topicId) {
            const topic = database.find(t => t.id === topicId);
            if (!topic) return;

            currentQuiz.topic = topic;
            currentQuiz.questions = topic.questions;
            currentQuiz.index = 0;
            currentQuiz.score = 0;
            currentQuiz.gainedXP = 0;

            showScreen(2);
            loadQuestion();
        }

        function loadQuestion() {
            const q = currentQuiz.questions[currentQuiz.index];
            const total = currentQuiz.questions.length;

            document.getElementById('progress-bar').style.width = `${((currentQuiz.index) / total) * 100}%`;
            document.getElementById('card-question').innerText = q.q;
            document.getElementById('card-svg').innerHTML = q.svg;
            
            // Ocultar pista y explicación previas
            const hintBox = document.getElementById('hint-box');
            hintBox.style.display = 'none';
            hintBox.innerText = `💡 Fórmula clave: ${currentQuiz.topic.formula}`;

            const expBox = document.getElementById('explanation-box');
            expBox.style.display = 'none';
            expBox.innerText = '';

            const optionsGrid = document.getElementById('options-grid');
            optionsGrid.innerHTML = '';

            q.options.forEach((opt, idx) => {
                optionsGrid.innerHTML += `
                    <button class="btn-option" onclick="checkAnswer(${idx}, this)">${opt}</button>
                `;
            });
        }

        // Alternar visualización de pistas/fórmulas
        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            if (hintBox.style.display === 'none' || hintBox.style.display === '') {
                hintBox.style.display = 'block';
            } else {
                hintBox.style.display = 'none';
            }
        }

        function checkAnswer(selectedIdx, btn) {
            const q = currentQuiz.questions[currentQuiz.index];
            const allBtns = document.querySelectorAll('.btn-option');
            allBtns.forEach(b => b.disabled = true);

            if (selectedIdx === q.correct) {
                btn.classList.add('correct');
                currentQuiz.score++;
                currentQuiz.gainedXP += 100;
                userStats.xp += 100;
                userStats.streak++;
                updateStatsUI();
                
                jsConfetti.addConfetti({
                    emojis: ['⚡', '✨'],
                    confettiNumber: 15,
                });

                setTimeout(nextQuestion, 1200);
            } else {
                btn.classList.add('incorrect');
                allBtns[q.correct].classList.add('correct');
                
                const expBox = document.getElementById('explanation-box');
                expBox.innerText = q.exp;
                expBox.style.display = 'block';

                userStats.streak = 0;
                updateStatsUI();

                setTimeout(nextQuestion, 3000);
            }
        }

        function nextQuestion() {
            currentQuiz.index++;
            if (currentQuiz.index < currentQuiz.questions.length) {
                loadQuestion();
            } else {
                endQuiz();
            }
        }

        // --- PANTALLA 3: RESUMEN ---
        function endQuiz() {
            showScreen(3);
            document.getElementById('res-score').innerText = `${currentQuiz.score}/${currentQuiz.questions.length}`;
            document.getElementById('res-xp').innerText = `+${currentQuiz.gainedXP} XP`;
            
            if (currentQuiz.score > 0) {
                jsConfetti.addConfetti();
            }
        }
    </script>
</body>
</html>
